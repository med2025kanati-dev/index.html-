<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ختمة القرآن الكريم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f2f5fa;--ink:#11213a;--mut:#56657d;--pri:#1d3f77;--card:#fff;--line:#d3dbe8;--gold:#b07a1c;--goldbg:#fdf1d8;--ok:#23704a;--okbg:#ddf2e5;--bad:#a53a2b}
@media(prefers-color-scheme:dark){:root{--bg:#0e1626;--ink:#e8eefb;--mut:#9fb0cc;--pri:#8db4f5;--card:#16213a;--line:#2a3a5c;--gold:#e8b85c;--goldbg:#2e2512;--ok:#6fd196;--okbg:#17301f;--bad:#f09080}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 19px/1.8 'Noto Naskh Arabic',serif}
.top{background:var(--pri);color:#fff;text-align:center;padding:calc(14px + env(safe-area-inset-top)) 12px 14px;font:700 1.5rem Amiri,serif}
.top a{color:#fff;text-decoration:none}
@media(prefers-color-scheme:dark){.top{color:#0e1626}.top a{color:#0e1626}}
main{max-width:620px;margin:0 auto;padding:16px 14px 60px}
h2{font:700 1.4rem Amiri,serif;margin:.2em 0 .4em}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.mut{color:var(--mut);font-size:.95rem}.ctr{text-align:center}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=password],input[type=email]{width:100%;font:inherit;font-size:1.1rem;padding:13px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.b{display:block;width:100%;min-height:56px;font:600 1.15rem 'Noto Naskh Arabic',serif;border:0;border-radius:14px;background:var(--pri);color:#fff;padding:10px;margin:10px 0 0;cursor:pointer;text-align:center;text-decoration:none}
@media(prefers-color-scheme:dark){.b{color:#0e1626}}
.b.o{background:transparent;color:var(--pri);border:2px solid var(--pri)}.b.r{background:transparent;color:var(--bad);border:2px solid var(--bad)}.b.g{background:#1d8348;color:#fff}
.b:disabled{opacity:.5}
.sm{display:inline-block;min-height:44px;padding:6px 16px;font:600 1rem 'Noto Naskh Arabic',serif;border-radius:12px;border:2px solid var(--pri);color:var(--pri);background:transparent;cursor:pointer}.sm.r{border-color:var(--bad);color:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;height:16px;margin:10px 0}.seg i{background:var(--line);border-radius:3px}.seg i.r{background:var(--gold)}.seg i.d{background:var(--ok)}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:center}.st div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px}.st b{display:block;font-size:1.7rem;line-height:1.3}
.g30{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.t{min-height:90px;border-radius:16px;border:2px solid var(--pri);background:var(--card);color:var(--ink);font:inherit;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3;cursor:pointer}
.t b{font:700 1.7rem Amiri,serif}.t small{font-size:.85rem;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t.r{border-color:var(--gold);background:var(--goldbg);cursor:default}.t.d{border-color:var(--ok);background:var(--okbg);cursor:default}.t.me{box-shadow:0 0 0 4px var(--pri)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0;flex-wrap:wrap}
.tag{font-size:.9rem;padding:0 10px;border-radius:20px;background:var(--goldbg);color:var(--gold)}.tag.ok{background:var(--okbg);color:var(--ok)}
.msg{color:var(--bad);min-height:1.5em}
.lnk{direction:ltr;text-align:left;font:500 .9rem monospace;word-break:break-all;background:var(--bg);padding:10px;border-radius:10px}
dialog{border:0;border-radius:18px;padding:20px;width:min(92vw,440px);background:var(--card);color:var(--ink)}dialog::backdrop{background:#0008}
details{margin-top:24px}summary{cursor:pointer;font-weight:600}
select{width:100%;font:inherit;font-size:1.1rem;padding:13px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.night .pg{filter:invert(1) hue-rotate(180deg)}

.top{display:flex;align-items:center;justify-content:space-between;text-align:right;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(135deg,#17335f,#25518f);color:#fff;font:700 1.35rem Amiri,serif}
.top a{color:#fff}.top nav a{font:600 .95rem 'Noto Naskh Arabic',serif;padding:4px 14px;border:1.5px solid #ffffff99;border-radius:999px}
.hero{margin:-16px -14px 18px;padding:30px 18px 26px;text-align:center;color:#fff;background:radial-gradient(#ffffff26 1.5px,transparent 2px) 0 0/22px 22px,linear-gradient(160deg,#17335f,#2d62ad);border-radius:0 0 30px 30px;box-shadow:0 8px 24px #17335f33}
.hero h1{font:700 2.1rem Amiri,serif;margin:0 0 6px}.hero p{margin:0 0 14px;opacity:.92}
.b.w{background:#fff;color:#17335f}.b.w2{background:transparent;color:#fff;border:2px solid #fff}.hl{display:block;margin-top:12px;color:#fff;font-weight:600}
.c{box-shadow:0 2px 10px #17335f14}.b{box-shadow:0 2px 6px #17335f22}
.kc{border-top:5px solid var(--pri)}.kc h3{font:700 1.35rem Amiri,serif;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{font-size:.88rem;padding:1px 10px;border-radius:999px;background:var(--okbg);color:var(--ok)}.chip.g{background:var(--goldbg);color:var(--gold)}.chip.n{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.pbar{display:flex;height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}.pbar i.d{background:var(--ok)}.pbar i.r{background:var(--gold)}
.khead{background:linear-gradient(180deg,var(--card),var(--bg));border:1px solid var(--line);border-top:5px solid var(--pri);border-radius:22px;padding:14px;margin-bottom:12px}
.khead h2{margin:0}.khead p{margin:2px 0}
.st div:nth-child(1) b{color:var(--pri)}.st div:nth-child(2) b{color:var(--gold)}.st div:nth-child(3) b{color:var(--ok)}
.t{transition:transform .1s,box-shadow .1s;min-height:112px}.t .jl{font-size:.8rem;color:var(--mut);line-height:1.2}.t b.jo{font:700 1.15rem/1.3 Amiri,serif;text-align:center}.t small.rd{font-weight:600;color:var(--ink)}.t:not(.r):not(.d):active{transform:scale(.96)}
.t:not(.r):not(.d){background:linear-gradient(180deg,var(--card),var(--bg))}
.authbox{max-width:440px;margin:10px auto}
#rd{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.rb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card)}.rb b{flex:1;text-align:center}
.rbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 6px 40px}.pg{display:block;width:100%;max-width:900px;margin:0 auto 8px;background:#fff;border-radius:6px}
</style></head>
<body><div class="top"><a href="#/">ختمة القرآن الكريم</a><nav id="nav"></nav></div><main id="app"></main><dialog id="dlg"></dialog><div id="rd"></div>
<script>
const U='https://knwdlmboealgjyomaqtb.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtud2RsbWJvZWFsZ2p5b21hcXRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODExNDYsImV4cCI6MjEwNzc1NzE0Nn0.68rccaY3gTQXWs9AKZD_yUzKQWo_-EoSsCulmTKPLkY';
const db=supabase.createClient(U,K);
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s),app=$('#app'),dlg=$('#dlg'),rd=$('#rd');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEV=localStorage.tok||(localStorage.tok=crypto.randomUUID()+crypto.randomUUID());let TOK=DEV;
const L=s=>s==='completed'?'مكتمل':'أثناء القراءة',N=n=>String(n).padStart(2,'0');
const FILE=n=>U+'/storage/v1/object/public/mushaf/juz'+N(n)+'.pdf';
const base=()=>location.origin+location.pathname,pubUrl=s=>base()+'#/k/'+s;
const rpc=async(f,a)=>{const{data,error}=await db.rpc(f,a);if(error)throw error;return data};
const files=async()=>{try{const{data}=await db.storage.from('mushaf').list('',{limit:100});return new Set((data||[]).map(f=>f.name))}catch(e){return new Set()}};
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/6e4);return m<2?'الآن':m<60?'منذ '+m+' دقيقة':m<1440?'منذ '+Math.round(m/60)+' ساعة':'منذ '+Math.round(m/1440)+' يوم'};
const wa=s=>'https://wa.me/?text='+encodeURIComponent('تفضلوا بالمشاركة في ختمة القرآن الكريم، احجز جزءًا واقرأه:\n'+pubUrl(s));
const PRIV=`<details><summary>سياسة الخصوصية</summary><p class="mut">القارئ لا يحتاج حسابًا. نحفظ الاسم الذي تكتبه والجزء الذي تحجزه ومكان توقفك في القراءة، ورمزًا عشوائيًا في متصفحك لتتحكم في حجزك. تظهر الأسماء للجميع فقط إذا فعّل المنشئ ذلك، وإلا يراها المنشئ وحده وترى اسمك أنت. لا نبيع البيانات ولا نعرض إعلانات. الثواب يُهدى وفق اعتقاد كل مشارك.</p></details>`;
let timer,me={s:null,owner:false},META={};
let CFG={},MSGS=[];const ORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر','التاسع عشر','العشرون','الحادي والعشرون','الثاني والعشرون','الثالث والعشرون','الرابع والعشرون','الخامس والعشرون','السادس والعشرون','السابع والعشرون','الثامن والعشرون','التاسع والعشرون','الثلاثون'];const JN=n=>'الجزء '+ORD[n-1];const F=(k,d=true)=>{const v=(CFG.flags||{})[k];return v===undefined?d:v};
const trDone=new WeakMap();
function tr(){const tx=CFG.texts;if(!tx||app.dataset.ctl||!Object.keys(tx).length)return;
 const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
 while(n=w.nextNode()){if(trDone.get(n)===n.nodeValue)continue;let v=n.nodeValue,ch=false;
  for(const[a,b]of Object.entries(tx)){if(v.includes(a)){v=v.split(a).join(b);ch=true}}
  if(ch){n.nodeValue=v;trDone.set(n,v)}}}
let tq;new MutationObserver(()=>{clearTimeout(tq);tq=setTimeout(tr,30)}).observe(document.body,{childList:true,subtree:true,characterData:true});
async function loadCfg(){try{CFG=(await rpc('site_config'))||{}}catch(e){CFG={}}tr()}
function fatiha(){rd.style.display='flex';rd.innerHTML='<div class="rb"><button class="sm" id="x">إغلاق</button><b>سورة الفاتحة</b></div><div class="rbody"><img src="fatiha.jpg" alt="سورة الفاتحة" style="display:block;width:100%;max-width:700px;margin:0 auto;background:#fff;border-radius:8px"></div>';$('#x').onclick=()=>{rd.style.display='none';rd.innerHTML=''}}
const FLAGS=[['site_open','فتح الموقع للزوار (إيقافه = وضع الصيانة)'],['show_browse','عرض قائمة الختمات المتاحة في الصفحة العامة'],['signup_create','السماح بالتسجيل لإنشاء ختمة'],['signup_join','السماح بالتسجيل للانضمام'],['guest','السماح بالانضمام كزائر بلا حساب'],['fatiha','عرض سورة الفاتحة في صفحة الختمة'],['new_khatma','السماح بإنشاء ختمات جديدة']];
const TEXTS=['ختمة القرآن الكريم','اجتمعوا على كتاب الله: كل قارئ يأخذ جزءًا حتى تتم الختمة، وثوابها يُهدى وفق اعتقاد المشاركين.','سجّل حسابًا لإنشاء ختمة','سجّل حسابًا للانضمام إلى ختمة','الختمات المتاحة للقراءة','متاح للقراءة','أثناء القراءة','مكتمل','منضم للختمة','افتح الختمة','اقرأ الآن','أكملت القراءة','إلغاء الحجز','اختر جزءًا','سورة الفاتحة','سياسة الخصوصية'];
async function control(){
 app.dataset.ctl=1;const tx=CFG.texts||{};
 app.innerHTML=`<h2 class="ctr">التحكم والكتابات</h2><p class="ctr mut">تُحفظ الإعدادات وتظهر لكل الزوار.</p>
 <div class="c"><h2>الصفحات والميزات</h2>${FLAGS.map(([k,t])=>`<label style="display:flex;gap:10px;font-weight:400"><input type="checkbox" data-f="${k}" ${F(k)?'checked':''} style="width:24px;height:24px;margin-top:6px"><span>${t}</span></label>`).join('')}<label for="cm">رسالة الصيانة</label><input id="cm" type="text" maxlength="200" value="${esc(CFG.closed_msg||'')}"></div>
 <div class="c"><h2>تغيير الكلمات</h2><p class="mut">اكتب بديل أي عبارة، واتركه فارغًا للنص الأصلي. يُستبدل النص في كل مواضع ظهوره.</p>${TEXTS.map((t,i)=>`<label>${esc(t)}</label><input type="text" data-t="${i}" maxlength="200" value="${esc(tx[t]||'')}">`).join('')}</div>
 <p class="msg ctr" id="cmsg"></p><button class="b" id="cs">حفظ</button><a class="b o" href="#/site">رجوع</a>`;
 $('#cs').onclick=async()=>{const f={},t={};app.querySelectorAll('[data-f]').forEach(c=>f[c.dataset.f]=c.checked);app.querySelectorAll('[data-t]').forEach(i=>{const v=i.value.trim();if(v)t[TEXTS[i.dataset.t]]=v});
  try{await rpc('set_site_config',{p_key:'flags',p_value:f});await rpc('set_site_config',{p_key:'texts',p_value:t});await rpc('set_site_config',{p_key:'closed_msg',p_value:$('#cm').value.trim()});await loadCfg();$('#cmsg').style.color='var(--ok)';$('#cmsg').textContent='تم الحفظ'}
  catch(e){$('#cmsg').style.color='var(--bad)';$('#cmsg').textContent='تعذّر الحفظ'}}}

async function who(){const{data:{session}}=await db.auth.getSession();me.s=session;me.owner=false;TOK=session?'u:'+session.user.id:DEV;if(session){try{me.owner=await rpc('is_owner')}catch(e){}}}
async function route(){clearInterval(timer);app.onclick=app.onchange=null;delete app.dataset.ctl;
 if(!me.init){await who();await loadCfg();me.init=1}
 $('#nav').innerHTML=me.s?'<a href="#/me">حسابي</a>':'<a href="#/login">دخول</a>';
 const h=location.hash.split('/');
 if(!F('site_open')&&!me.owner&&h[1]!=='login'){app.innerHTML=`<div class="c ctr"><h2>الموقع مغلق مؤقتًا</h2><p>${esc(CFG.closed_msg||'نعود قريبًا بإذن الله.')}</p></div>`;return}
 if(h[1]==='signup'&&!F(h[2]==='create'?'signup_create':'signup_join')){app.innerHTML='<div class="c ctr"><h2>هذه الصفحة غير متاحة حاليًا</h2></div><a class="b o" href="#/">الصفحة الرئيسية</a>';return}
 if(h[1]==='control')return me.owner?control():(location.hash='#/');
 if(h[1]==='k')return pub(h[2]);
 if(h[1]==='login')return auth('in');
 if(h[1]==='signup')return auth('up',h[2]);
 if(h[1]==='me')return me.s?dash():auth('in');
 if(h[1]==='a')return me.s?admin(h[2]):auth('in');
 if(h[1]==='site')return me.owner?site():(location.hash='#/');
 if(h[1]==='files')return me.owner?files_():(location.hash='#/');
 return home()}
addEventListener('hashchange',route);

function auth(mode,role){
 const ttl=mode==='in'?'دخول':role==='create'?'حساب لإنشاء ختمة':'حساب للانضمام إلى ختمة';
 app.innerHTML=`<div class="authbox"><h2 class="ctr">${ttl}</h2><p class="ctr mut">${mode==='in'?'ادخل ببريدك وكلمة مرورك':'حساب واحد يحفظ أجزاءك ومكان قراءتك على كل أجهزتك'}</p>
 <form class="c" id="af">${mode==='up'?'<label for="an">اسمك</label><input id="an" type="text" maxlength="60" required>':''}
 <label for="ae">البريد الإلكتروني</label><input id="ae" type="email" autocomplete="username" required>
 <label for="ap">كلمة المرور (6 أحرف فأكثر)</label><input id="ap" type="password" minlength="6" required autocomplete="${mode==='in'?'current-password':'new-password'}">
 <p class="msg" id="am"></p><button class="b">${mode==='in'?'دخول':'إنشاء الحساب'}</button></form>
 ${mode==='in'?'<a class="b o" href="#/signup/join">ليس لدي حساب: تسجيل</a>':'<a class="b o" href="#/login">لدي حساب: دخول</a>'}<a class="b o" href="#/">الصفحة الرئيسية</a></div>`;
 $('#af').onsubmit=async e=>{e.preventDefault();const email=$('#ae').value.trim(),password=$('#ap').value,am=$('#am');
  const r=mode==='in'?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password,options:{data:{name:$('#an').value.trim()},emailRedirectTo:location.origin+location.pathname}});
  if(r.error){am.textContent=mode==='in'?'البريد أو كلمة المرور غير صحيحة':'تعذّر إنشاء الحساب: '+r.error.message;return}
  if(!r.data.session){am.style.color='var(--ok)';am.textContent='تم إنشاء الحساب. افتح بريدك واضغط رابط التأكيد ثم ادخل.';return}
  await who();const rt=sessionStorage.ret;sessionStorage.removeItem('ret');
  const t=rt||(/^#\/(a|me)/.test(location.hash)?null:role==='join'?'#/':'#/me');
  if(t&&location.hash!==t)location.hash=t;else route()}}

async function home(){
 app.innerHTML=`<div class="hero"><h1>ختمة القرآن الكريم</h1><p>اجتمعوا على كتاب الله: كل قارئ يأخذ جزءًا حتى تتم الختمة، وثوابها يُهدى وفق اعتقاد المشاركين.</p>
 ${F('signup_create')?'<a class="b w" href="#/signup/create">سجّل حسابًا لإنشاء ختمة</a>':''}${F('signup_join')?'<a class="b w2" href="#/signup/join">سجّل حسابًا للانضمام إلى ختمة</a>':''}
 ${me.s?'<a class="hl" href="#/me">الدخول إلى حسابي</a>':'<a class="hl" href="#/login">لدي حساب: دخول</a>'}</div>
 ${F('show_browse')?'<h2>الختمات المتاحة للقراءة</h2><div id="bl"><p class="ctr mut">جارٍ التحميل…</p></div>':''}${PRIV}`;
 if(!F('show_browse'))return;
 try{const l=await rpc('public_khatmas');
  $('#bl').innerHTML=l.length?l.map(k=>`<div class="c kc"><h3>${esc(k.title||(k.deceased_name?'ختمة عن روح '+k.deceased_name:'ختمة القرآن الكريم'))}</h3>
   <p class="mut" style="margin:0">المنشئ: ${esc(k.creator_name)} · ${new Date(k.created_at).toLocaleDateString('ar')}${k.deceased_name?' · المُهدى إليه: '+esc(k.deceased_name):''}</p>
   ${k.description?`<p style="margin:6px 0">${esc(k.description)}</p>`:''}${k.dua?`<p style="margin:4px 0;font:700 1.1rem Amiri,serif">${esc(k.dua)}</p>`:''}

  $('#bm').onclick=()=>{const p=Math.min(tot,Math.round(bd.scrollTop/hh())+1);localStorage[bk]=p;localStorage[key]=p;if(ctx.mine)rpc('save_progress',{p_slug:ctx.slug,p_juz:n,p_token:TOK,p_page:p,p_pages:tot}).catch(()=>{});$('#bm').textContent='تم الحفظ عند صفحة '+p;setTimeout(()=>{const b=$('#bm');if(b)b.textContent='حفظ موضعي'},2200)};
  $('#gb').onclick=()=>{const p=+localStorage[bk];if(!p){alert('لم تحفظ موضعًا بعد');return}bd.scrollTo({top:(p-1)*hh(),behavior:'smooth'})};const hh=()=>cs[0].offsetHeight+8,key='pg:'+(ctx.slug||'p')+':'+n;
  const st=Math.min(tot,Math.max(1,+ctx.page||+localStorage[key]||1));bd.scrollTop=(st-1)*hh();$('#pi').textContent='صفحة '+st+' من '+tot;
  let t;bd.onscroll=()=>{const p=Math.min(tot,Math.round(bd.scrollTop/hh())+1);$('#pi').textContent='صفحة '+p+' من '+tot;localStorage[key]=p;
   clearTimeout(t);t=setTimeout(()=>{if(ctx.mine)rpc('save_progress',{p_slug:ctx.slug,p_juz:n,p_token:TOK,p_page:p,p_pages:tot}).catch(()=>{})},1500)}}
 catch(e){bd.innerHTML='<p class="msg ctr" style="padding:30px">تعذّر فتح الملف، أعد المحاولة.</p>'}}

async function files_(){
 const have=await files();
 app.innerHTML=`<h2 class="ctr">ملفات الأجزاء</h2><p class="ctr mut">ارفع ملف PDF لكل جزء، ويظهر للقراء فورًا (${[...Array(30)].filter((_,i)=>have.has('juz'+N(i+1)+'.pdf')).length} من 30)</p><p class="msg ctr" id="om"></p>
 <div class="c">${[...Array(30)].map((_,i)=>{const n=i+1,h=have.has('juz'+N(n)+'.pdf');return `<div class="row"><span><b>الجزء ${n}</b> <span class="tag ${h?'ok':''}">${h?'مرفوع':'غير مرفوع'}</span></span><span>
  <label class="sm" for="f${n}" style="margin:0">${h?'استبدال':'رفع'}</label><input id="f${n}" data-n="${n}" type="file" accept="application/pdf,.pdf" style="display:none">
  ${h?`<button class="sm" data-v="${n}">عرض</button> <button class="sm r" data-x="${n}">حذف</button>`:''}</span></div>`}).join('')}</div><a class="b o" href="#/">رجوع</a>`;
 app.onchange=async e=>{const n=e.target.dataset?.n,f=e.target.files?.[0];if(!n||!f)return;
  if(f.size>5e7){$('#om').textContent='حجم الملف أكبر من 50 ميغابايت';return}
  $('#om').textContent='جارٍ رفع الجزء '+n+'…';
  const{error}=await db.storage.from('mushaf').upload('juz'+N(n)+'.pdf',f,{upsert:true,contentType:'application/pdf'});
  if(error){$('#om').textContent='تعذّر الرفع: '+error.message;return}await files_();$('#om').textContent='تم رفع الجزء '+n};
 app.onclick=async e=>{const v=e.target.dataset?.v,x=e.target.dataset?.x;if(v)view(+v,{});
  if(x&&confirm('حذف ملف الجزء '+x+'؟')){await db.storage.from('mushaf').remove(['juz'+N(x)+'.pdf']);files_()}}}
route();
</script></body></html>
