<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ختمة القرآن الكريم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f2f5fa;--ink:#11213a;--mut:#56657d;--pri:#1d3f77;--card:#fff;--line:#d3dbe8;--gold:#b07a1c;--goldbg:#fdf1d8;--ok:#23704a;--okbg:#ddf2e5;--bad:#a53a2b}
@media(prefers-color-scheme:dark){:root{--bg:#0e1626;--ink:#e8eefb;--mut:#9fb0cc;--pri:#8db4f5;--card:#16213a;--line:#2a3a5c;--gold:#e8b85c;--goldbg:#2e2512;--ok:#6fd196;--okbg:#17301f;--bad:#f09080}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 19px/1.8 'Noto Naskh Arabic',serif}
.top{background:var(--pri);color:#fff;text-align:center;padding:calc(14px + env(safe-area-inset-top)) 12px 14px;font:700 1.5rem Amiri,serif}
.top a{color:#fff;text-decoration:none}
@media(prefers-color-scheme:dark){.top{color:#0e1626}.top a{color:#0e1626}}
main{max-width:620px;margin:0 auto;padding:16px 14px 60px}
h2{font:700 1.4rem Amiri,serif;margin:.2em 0 .4em}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.mut{color:var(--mut);font-size:.95rem}.ctr{text-align:center}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=password],input[type=email]{width:100%;font:inherit;font-size:1.1rem;padding:13px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.b{display:block;width:100%;min-height:56px;font:600 1.15rem 'Noto Naskh Arabic',serif;border:0;border-radius:14px;background:var(--pri);color:#fff;padding:10px;margin:10px 0 0;cursor:pointer;text-align:center;text-decoration:none}
@media(prefers-color-scheme:dark){.b{color:#0e1626}}
.b.o{background:transparent;color:var(--pri);border:2px solid var(--pri)}.b.r{background:transparent;color:var(--bad);border:2px solid var(--bad)}.b.g{background:#1d8348;color:#fff}
.b:disabled{opacity:.5}
.sm{display:inline-block;min-height:44px;padding:6px 16px;font:600 1rem 'Noto Naskh Arabic',serif;border-radius:12px;border:2px solid var(--pri);color:var(--pri);background:transparent;cursor:pointer}.sm.r{border-color:var(--bad);color:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;height:16px;margin:10px 0}.seg i{background:var(--line);border-radius:3px}.seg i.r{background:var(--gold)}.seg i.d{background:var(--ok)}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:center}.st div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px}.st b{display:block;font-size:1.7rem;line-height:1.3}
.g30{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.t{min-height:90px;border-radius:16px;border:2px solid var(--pri);background:var(--card);color:var(--ink);font:inherit;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3;cursor:pointer}
.t b{font:700 1.7rem Amiri,serif}.t small{font-size:.85rem;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t.r{border-color:var(--gold);background:var(--goldbg);cursor:default}.t.d{border-color:var(--ok);background:var(--okbg);cursor:default}.t.me{box-shadow:0 0 0 4px var(--pri)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0;flex-wrap:wrap}
.tag{font-size:.9rem;padding:0 10px;border-radius:20px;background:var(--goldbg);color:var(--gold)}.tag.ok{background:var(--okbg);color:var(--ok)}
.msg{color:var(--bad);min-height:1.5em}
.lnk{direction:ltr;text-align:left;font:500 .9rem monospace;word-break:break-all;background:var(--bg);padding:10px;border-radius:10px}
dialog{border:0;border-radius:18px;padding:20px;width:min(92vw,440px);background:var(--card);color:var(--ink)}dialog::backdrop{background:#0008}
details{margin-top:24px}summary{cursor:pointer;font-weight:600}
#rd{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.rb{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card)}.rb b{flex:1;text-align:center}
.rbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 6px 40px}.pg{display:block;width:100%;max-width:900px;margin:0 auto 8px;background:#fff;border-radius:6px}
</style></head>
<body><div class="top"><a href="#/">ختمة القرآن الكريم</a></div><main id="app"></main><dialog id="dlg"></dialog><div id="rd"></div>
<script>
const U='https://knwdlmboealgjyomaqtb.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtud2RsbWJvZWFsZ2p5b21hcXRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODExNDYsImV4cCI6MjEwNzc1NzE0Nn0.68rccaY3gTQXWs9AKZD_yUzKQWo_-EoSsCulmTKPLkY';
const db=supabase.createClient(U,K);
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s),app=$('#app'),dlg=$('#dlg'),rd=$('#rd');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOK=localStorage.tok||(localStorage.tok=crypto.randomUUID()+crypto.randomUUID());
const L=s=>s==='completed'?'مكتمل':'أثناء القراءة',N=n=>String(n).padStart(2,'0');
const FILE=n=>U+'/storage/v1/object/public/mushaf/juz'+N(n)+'.pdf';
const base=()=>location.origin+location.pathname,pubUrl=s=>base()+'#/k/'+s;
const rpc=async(f,a)=>{const{data,error}=await db.rpc(f,a);if(error)throw error;return data};
const files=async()=>{try{const{data}=await db.storage.from('mushaf').list('',{limit:100});return new Set((data||[]).map(f=>f.name))}catch(e){return new Set()}};
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/6e4);return m<2?'الآن':m<60?'منذ '+m+' دقيقة':m<1440?'منذ '+Math.round(m/60)+' ساعة':'منذ '+Math.round(m/1440)+' يوم'};
const wa=s=>'https://wa.me/?text='+encodeURIComponent('تفضلوا بالمشاركة في ختمة القرآن الكريم، احجز جزءًا واقرأه:\n'+pubUrl(s));
const PRIV=`<details><summary>سياسة الخصوصية</summary><p class="mut">القارئ لا يحتاج حسابًا. نحفظ الاسم الذي تكتبه والجزء الذي تحجزه ومكان توقفك في القراءة، ورمزًا عشوائيًا في متصفحك لتتحكم في حجزك. تظهر الأسماء للجميع فقط إذا فعّل المنشئ ذلك، وإلا يراها المنشئ وحده وترى اسمك أنت. لا نبيع البيانات ولا نعرض إعلانات. الثواب يُهدى وفق اعتقاد كل مشارك.</p></details>`;
let timer,me={s:null,owner:false};
async function who(){const{data:{session}}=await db.auth.getSession();me.s=session;me.owner=false;if(session){try{me.owner=await rpc('is_owner')}catch(e){}}}
async function route(){clearInterval(timer);app.onclick=app.onchange=null;const h=location.hash.split('/');
 if(h[1]==='k')return pub(h[2]);
 if(!me.s&&!me.init){await who();me.init=1}
 if(h[1]==='a')return me.s?admin(h[2]):auth('in');
 if(h[1]==='files')return me.owner?files_():(location.hash='#/');
 return me.s?dash():auth('in')}
addEventListener('hashchange',route);

function auth(mode){
 app.innerHTML=`<p class="ctr mut">القارئ لا يحتاج حسابًا. الحساب لمنشئ الختمة فقط ليدير ختمته ويتابع إحصائياتها.</p>
 <form class="c" id="af"><h2>${mode==='in'?'دخول المنشئ':'إنشاء حساب منشئ'}</h2>
 ${mode==='up'?'<label for="an">اسمك</label><input id="an" type="text" maxlength="60" required>':''}
 <label for="ae">البريد الإلكتروني</label><input id="ae" type="email" autocomplete="username" required>
 <label for="ap">كلمة المرور (6 أحرف فأكثر)</label><input id="ap" type="password" minlength="6" required autocomplete="${mode==='in'?'current-password':'new-password'}">
 <p class="msg" id="am"></p><button class="b">${mode==='in'?'دخول':'إنشاء الحساب'}</button></form>
 <button class="b o" id="sw">${mode==='in'?'ليس لدي حساب: إنشاء حساب':'لدي حساب: دخول'}</button>${PRIV}`;
 $('#sw').onclick=()=>auth(mode==='in'?'up':'in');
 $('#af').onsubmit=async e=>{e.preventDefault();const email=$('#ae').value.trim(),password=$('#ap').value,am=$('#am');
  const r=mode==='in'?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password,options:{data:{name:$('#an').value.trim()}}});
  if(r.error){am.textContent=mode==='in'?'البريد أو كلمة المرور غير صحيحة':'تعذّر إنشاء الحساب: '+r.error.message;return}
  if(!r.data.session){am.style.color='var(--ok)';am.textContent='تم إنشاء الحساب. افتح بريدك واضغط رابط التأكيد ثم ادخل.';return}
  await who();route()}}

async function dash(){
 const nm=me.s.user.user_metadata?.name||'';
 app.innerHTML=`<p class="ctr mut">أهلًا ${esc(nm)}</p>
 <form class="c" id="f"><h2>ختمة جديدة</h2><label for="d">اسم المتوفى (اختياري)</label><input id="d" type="text" maxlength="80">
 <label style="display:flex;gap:10px;font-weight:400"><input id="s" type="checkbox" checked style="width:24px;height:24px;margin-top:6px"><span>إظهار أسماء المشاركين للقراء</span></label>
 <p class="msg" id="m"></p><button class="b">أنشئ الختمة</button></form><div id="ml"></div>
 ${me.owner?'<a class="b o" href="#/files">ملفات الأجزاء (للمالك)</a>':''}<button class="b o" id="lo">تسجيل الخروج</button>${PRIV}`;
 $('#lo').onclick=async()=>{await db.auth.signOut();me.s=null;me.owner=false;route()};
 $('#f').onsubmit=async e=>{e.preventDefault();const bt=e.submitter;bt.disabled=true;
  try{location.hash='#/a/'+await rpc('create_khatma',{p_deceased:$('#d').value,p_creator:nm||'المنشئ',p_show_names:$('#s').checked})}
  catch(x){$('#m').textContent='تعذّر الإنشاء، أعد المحاولة.';bt.disabled=false}};
 try{const l=await rpc('my_khatmas');
  $('#ml').innerHTML=l.length?`<h2>ختماتي</h2>`+l.map(k=>`<div class="c"><b>${k.deceased_name?'عن روح '+esc(k.deceased_name):'ختمة القرآن الكريم'}</b>
   <p class="mut" style="margin:0">${k.participants} منضم · ${k.reading} أثناء القراءة · ${k.completed} مكتمل من 30</p>
   <a class="b" href="#/a/${k.slug}">الإدارة والإحصائيات</a><button class="b o" data-cp="${k.slug}">نسخ رابط القراءة</button></div>`).join(''):'';
  app.onclick=e=>{const s=e.target.dataset?.cp;if(s){navigator.clipboard.writeText(pubUrl(s));e.target.textContent='تم النسخ'}}}catch(e){}}

const calc=k=>{const by={};k.claims.forEach(c=>by[c.juz]=c);const done=k.claims.filter(c=>c.status==='completed').length;return{by,done,held:k.claims.length-done,free:30-k.claims.length}};
const bar=(by,done)=>`<div class="seg">${[...Array(30)].map((_,i)=>`<i class="${by[i+1]?.status==='completed'?'d':by[i+1]?'r':''}"></i>`).join('')}</div><p class="ctr" style="margin:0">اكتمل ${done} من 30 · ${Math.round(done/30*100)}%</p>`;
const tiles=(k,s)=>`<div class="st"><div><b>${k.participants}</b>منضم للختمة</div><div><b>${s.held}</b>أثناء القراءة</div><div><b>${s.free}</b>متاح للقراءة</div><div><b>${s.done}</b>مكتمل</div></div>`;
const title=k=>`<h2 class="ctr">${k.deceased_name?'ختمة عن روح '+esc(k.deceased_name):'ختمة القرآن الكريم'}</h2><p class="ctr mut">المنشئ: ${esc(k.creator_name)}${k.deceased_name?' · اللهم اغفر له وارحمه':''}</p>`;

async function pub(slug){
 const load=async()=>{try{const k=await rpc('get_khatma',{p_slug:slug,p_token:TOK});
  if(!k){app.innerHTML='<p class="ctr">الرابط غير صحيح</p>';return}draw(k)}catch(e){const m=$('#err');if(m)m.textContent='انقطع الاتصال، سنعيد المحاولة'}};
 const draw=k=>{const s=calc(k),my=k.claims.filter(c=>c.mine);
  app.innerHTML=`${title(k)}${tiles(k,s)}<div class="c">${bar(s.by,s.done)}</div>
  ${s.done===30?'<div class="c ctr"><h2>تمّت الختمة، تقبّل الله من الجميع</h2></div>':''}<p class="msg ctr" id="err"></p>
  ${my.length?`<div class="c"><h2>أجزائي</h2>${my.map(c=>`<div class="row" style="display:block"><b>الجزء ${c.juz}</b> <span class="tag ${c.status==='completed'?'ok':''}">${L(c.status)}</span>
   ${c.page?`<p class="mut" style="margin:0">توقفت عند صفحة ${c.page} من ${c.pages}</p>`:''}
   <button class="b" data-a="read" data-j="${c.juz}">${c.page?'أكمل من حيث توقفت':'اقرأ الآن'}</button>
   ${c.status!=='completed'?`<button class="b o" data-a="completed" data-j="${c.juz}">أكملت القراءة</button><button class="b r" data-a="release" data-j="${c.juz}">إلغاء الحجز</button>`:''}</div>`).join('')}</div>`:''}
  <h2>اختر جزءًا</h2><div class="g30">${[...Array(30)].map((_,i)=>{const c=s.by[i+1];
   return `<button class="t ${c?c.status==='completed'?'d':'r':''} ${c?.mine?'me':''}" data-a="pick" data-j="${i+1}" ${c?'disabled':''}><b>${i+1}</b><small>${c?esc(c.name||L(c.status)):'متاح للقراءة'}</small></button>`}).join('')}</div>${PRIV}`;
  app.onclick=e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,+b.dataset.j,k)}};
 const act=async(a,j,k)=>{
  if(a==='pick')return pick(j);
  if(a==='read'){const c=k.claims.find(x=>x.juz===j);return view(j,{slug,page:c?.page,mine:1,done:load})}
  if(a==='release'&&!confirm('إلغاء حجز هذا الجزء؟'))return;
  try{if(a==='release')await rpc('release_juz',{p_slug:slug,p_juz:j,p_token:TOK});else await rpc('set_status',{p_slug:slug,p_juz:j,p_token:TOK,p_status:a})}catch(e){}load()};
 const pick=j=>{dlg.innerHTML=`<h2>حجز الجزء ${j}</h2><label for="pn">اسمك</label><input id="pn" type="text" maxlength="60" value="${esc(localStorage.name||'')}"><p class="msg" id="dm"></p><button class="b" id="ok">احجز الجزء ${j}</button><button class="b o" id="no">إلغاء</button>`;dlg.showModal();
  $('#no').onclick=()=>dlg.close();
  $('#ok').onclick=async()=>{const n=$('#pn').value.trim();if(!n){$('#dm').textContent='اكتب اسمك أولًا';return}
   $('#ok').disabled=true;localStorage.name=n;
   try{const r=await rpc('claim_juz',{p_slug:slug,p_juz:j,p_name:n,p_token:TOK});
    if(r==='ok'){dlg.close();load();return}
    $('#dm').textContent=r==='taken'?'سبقك أحدهم إلى هذا الجزء، اختر جزءًا آخر.':r==='limit'?'يمكنك حجز 3 أجزاء كحد أقصى في الوقت نفسه.':'تعذّر الحجز.';
    if(r==='taken')setTimeout(()=>{dlg.close();load()},1800);else $('#ok').disabled=false}
   catch(e){$('#dm').textContent='تعذّر الاتصال، أعد المحاولة.';$('#ok').disabled=false}}};
 await load();timer=setInterval(()=>{if(!dlg.open&&rd.style.display!=='flex')load()},5000)}

async function admin(slug){
 const load=async()=>{try{const k=await rpc('get_khatma',{p_slug:slug,p_token:TOK});
  if(!k||!k.is_admin){app.innerHTML='<p class="ctr">هذه الختمة ليست ضمن حسابك.</p><a class="b" href="#/">رجوع</a>';return}draw(k)}catch(e){}};
 const draw=k=>{const s=calc(k);
  app.innerHTML=`${title(k)}
  <div class="c"><b>رابط القراءة (أرسله للمشاركين)</b><div class="lnk" style="margin-top:8px">${esc(pubUrl(slug))}</div>
  <a class="b g" target="_blank" rel="noopener" href="${wa(slug)}">إرسال عبر واتساب</a><button class="b o" data-a="cp">نسخ الرابط</button></div>
  ${tiles(k,s)}<div class="c">${bar(s.by,s.done)}</div>
  <div class="c"><h2>المشاركون والأجزاء</h2>${k.claims.map(c=>`<div class="row"><span><b>الجزء ${c.juz}</b> · ${esc(c.name)}<br><span class="mut">${L(c.status)}${c.page?' · صفحة '+c.page+' من '+c.pages:''} · ${ago(c.at)}</span></span>
   <span>${c.status!=='completed'?`<button class="sm" data-a="adone" data-j="${c.juz}">أكمل</button> `:''}<button class="sm r" data-a="arel" data-j="${c.juz}">إلغاء</button></span></div>`).join('')||'<p class="mut">لا توجد حجوزات بعد.</p>'}</div>
  <button class="b o" data-a="tn">${k.show_names?'إخفاء أسماء المشاركين عن القراء':'إظهار أسماء المشاركين للقراء'}</button>
  <button class="b r" data-a="adel">حذف الختمة نهائيًا</button><a class="b o" href="#/">رجوع لحسابي</a>`;
  app.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,j=+b.dataset.j;
   if(a==='cp'){navigator.clipboard.writeText(pubUrl(slug));b.textContent='تم النسخ';return}
   if(a==='arel'&&!confirm('إلغاء هذا الحجز؟'))return;
   if(a==='adel'){if(!confirm('سيُحذف كل شيء في هذه الختمة. متأكد؟'))return;await rpc('admin_delete',{p_slug:slug});location.hash='#/';return}
   try{if(a==='arel')await rpc('admin_release',{p_slug:slug,p_juz:j});
    else if(a==='adone')await rpc('admin_set_status',{p_slug:slug,p_juz:j,p_status:'completed'});
    else if(a==='tn')await rpc('set_show_names',{p_slug:slug,p_show:!k.show_names})}catch(x){}load()}};
 await load();timer=setInterval(load,8000)}

async function view(n,ctx){
 rd.style.display='flex';rd.innerHTML=`<div class="rb"><button class="sm" id="x">إغلاق</button><b>الجزء ${n}</b><span class="mut" id="pi"></span></div><div class="rbody" id="bd"><p class="ctr mut">جارٍ التحميل…</p></div>`;
 const close=()=>{rd.style.display='none';rd.innerHTML='';ctx.done&&ctx.done()};$('#x').onclick=close;const bd=$('#bd');
 if(!(await files()).has('juz'+N(n)+'.pdf')){bd.innerHTML='<p class="ctr" style="padding:30px">لم يُرفع هذا الجزء بعد، سيُضاف قريبًا.</p>';return}
 try{const pdf=await pdfjsLib.getDocument(FILE(n)).promise,tot=pdf.numPages,v=(await pdf.getPage(1)).getViewport({scale:1});bd.innerHTML='';const cs=[];
  for(let i=1;i<=tot;i++){const c=document.createElement('canvas');c.className='pg';c.dataset.n=i;c.style.aspectRatio=v.width+'/'+v.height;bd.appendChild(c);cs.push(c)}
  if(ctx.mine){const f=document.createElement('button');f.className='b';f.textContent='أكملت هذا الجزء';f.onclick=async()=>{try{await rpc('set_status',{p_slug:ctx.slug,p_juz:n,p_token:TOK,p_status:'completed'})}catch(e){}close()};bd.appendChild(f)}
  const io=new IntersectionObserver(es=>es.forEach(async e=>{const c=e.target;if(!e.isIntersecting||c.dataset.d)return;c.dataset.d=1;
   const pg=await pdf.getPage(+c.dataset.n),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(2.5,bd.clientWidth/v0.width*(devicePixelRatio||1))});
   c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}),{root:bd,rootMargin:'800px'});
  cs.forEach(c=>io.observe(c));const hh=()=>cs[0].offsetHeight+8,key='pg:'+(ctx.slug||'p')+':'+n;
  const st=Math.min(tot,Math.max(1,+ctx.page||+localStorage[key]||1));bd.scrollTop=(st-1)*hh();$('#pi').textContent='صفحة '+st+' من '+tot;
  let t;bd.onscroll=()=>{const p=Math.min(tot,Math.round(bd.scrollTop/hh())+1);$('#pi').textContent='صفحة '+p+' من '+tot;localStorage[key]=p;
   clearTimeout(t);t=setTimeout(()=>{if(ctx.mine)rpc('save_progress',{p_slug:ctx.slug,p_juz:n,p_token:TOK,p_page:p,p_pages:tot}).catch(()=>{})},1500)}}
 catch(e){bd.innerHTML='<p class="msg ctr" style="padding:30px">تعذّر فتح الملف، أعد المحاولة.</p>'}}

async function files_(){
 const have=await files();
 app.innerHTML=`<h2 class="ctr">ملفات الأجزاء</h2><p class="ctr mut">ارفع ملف PDF لكل جزء، ويظهر للقراء فورًا (${[...Array(30)].filter((_,i)=>have.has('juz'+N(i+1)+'.pdf')).length} من 30)</p><p class="msg ctr" id="om"></p>
 <div class="c">${[...Array(30)].map((_,i)=>{const n=i+1,h=have.has('juz'+N(n)+'.pdf');return `<div class="row"><span><b>الجزء ${n}</b> <span class="tag ${h?'ok':''}">${h?'مرفوع':'غير مرفوع'}</span></span><span>
  <label class="sm" for="f${n}" style="margin:0">${h?'استبدال':'رفع'}</label><input id="f${n}" data-n="${n}" type="file" accept="application/pdf,.pdf" style="display:none">
  ${h?`<button class="sm" data-v="${n}">عرض</button> <button class="sm r" data-x="${n}">حذف</button>`:''}</span></div>`}).join('')}</div><a class="b o" href="#/">رجوع</a>`;
 app.onchange=async e=>{const n=e.target.dataset?.n,f=e.target.files?.[0];if(!n||!f)return;
  if(f.size>5e7){$('#om').textContent='حجم الملف أكبر من 50 ميغابايت';return}
  $('#om').textContent='جارٍ رفع الجزء '+n+'…';
  const{error}=await db.storage.from('mushaf').upload('juz'+N(n)+'.pdf',f,{upsert:true,contentType:'application/pdf'});
  if(error){$('#om').textContent='تعذّر الرفع: '+error.message;return}await files_();$('#om').textContent='تم رفع الجزء '+n};
 app.onclick=async e=>{const v=e.target.dataset?.v,x=e.target.dataset?.x;if(v)view(+v,{});
  if(x&&confirm('حذف ملف الجزء '+x+'؟')){await db.storage.from('mushaf').remove(['juz'+N(x)+'.pdf']);files_()}}}
route();
</script></body></html>
